<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT | Canlı Yayın Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">NIGHT</div>
        <div class="search-bar">
            <input type="text" placeholder="Ara...">
        </div>
        <div class="user-area">
            <button id="login-btn" class="btn-primary">Giriş Yap</button>
            <div id="user-profile" class="hidden">
                <span id="user-name"></span>
                <button id="start-stream-btn" class="btn-live">Yayın Başlat</button>
            </div>
        </div>
    </header>

    <div class="container">
        
        <aside class="sidebar-left">
            <h3>Takip Edilenler</h3>
            <ul id="channel-list">
                <li class="channel-item">🎮 Oyun Odası</li>
                <li class="channel-item">🎵 Müzik Kanalları</li>
                <li class="channel-item">💬 Sohbet & Muhabbet</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="video-player">
                <div class="video-placeholder">Yayın Bekleniyor...</div>
            </div>
            <div class="stream-details">
                <h1>Canlı Yayın Başlığı Buraya Gelecek</h1>
                <p class="streamer-name">Yayıncı: Kullanıcı Adı</p>
            </div>
        </main>

        <section class="chat-sidebar">
            <div class="chat-header">CANLI SOHBET</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Bir şeyler yaz...">
                <button id="send-msg-btn">Gönder</button>
            </div>
        </section>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
