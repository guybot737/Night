<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT - Canlı Yayın</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-left">
        <div class="logo">NIGHT</div>
        <div class="search-bar">
            <input type="text" placeholder="Ara...">
        </div>
    </div>
    <div class="navbar-right">
        <button id="login-btn" class="btn-login">Giriş Yap</button>
        <div id="user-menu" class="user-menu hidden">
            <div class="user-info">
                <img id="user-avatar" src="" alt="Avatar" class="avatar">
                <span id="user-name"></span>
            </div>
            <button id="start-btn" class="btn-go-live">📡 Canlı Yayın Başlat</button>
            <button id="logout-btn" class="btn-logout">Çıkış</button>
        </div>
    </div>
</header>

<div class="main-container">
    <aside class="sidebar">
        <div class="sidebar-section">
            <h3>KEŞFET</h3>
            <a href="#" class="sidebar-item active">🏠 Ana Sayfa</a>
            <a href="#" class="sidebar-item">🔥 Trending</a>
            <a href="#" class="sidebar-item">🎮 Oyunlar</a>
            <a href="#" class="sidebar-item">🎵 Müzik</a>
            <a href="#" class="sidebar-item">📺 Sosyal</a>
            <a href="#" class="sidebar-item">💬 Sohbet</a>
        </div>
        <div class="sidebar-section">
            <h3>TAKİP EDİLENLER</h3>
            <div id="followed-channels">
                <a href="#" class="sidebar-item">Kanal 1</a>
                <a href="#" class="sidebar-item">Kanal 2</a>
            </div>
        </div>
    </aside>

    <main class="content">
        <div class="streams-grid" id="streams-grid">
            <!-- Yayınlar buraya yüklenir -->
        </div>
    </main>

    <aside class="chat-sidebar">
        <div class="chat-header">
            <h2>💬 Canlı Sohbet</h2>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Mesajlar buraya yüklenir -->
        </div>
        <div class="chat-input">
            <input type="text" id="msg-input" placeholder="Mesaj yazın...">
            <button id="send-btn">Gönder</button>
        </div>
    </aside>
</div>

<!-- Modal - Yayın Detayı -->
<div id="stream-modal" class="modal hidden">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="stream-player">
            <div id="video-player" class="video-player">
                <div class="placeholder">🔴 CANLI</div>
            </div>
        </div>
        <div class="stream-info">
            <h2 id="modal-title"></h2>
            <p id="modal-streamer"></p>
            <p id="modal-viewers"></p>
            <div class="stream-actions">
                <button id="follow-btn" class="btn-follow">Takip Et</button>
                <button id="donate-btn" class="btn-donate">💎 Bits Gönder</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
