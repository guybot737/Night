<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT | Canlı Yayın Platformu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">NIGHT</div>
        <div class="user-area">
            <button id="login-btn" class="btn-primary">Giriş Yap</button>
            <div id="user-profile" class="hidden">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-logout">Çıkış</button>
            </div>
        </div>
    </header>

    <div class="container">
        
        <main class="main-content">
            <div class="video-player">
                <div class="video-placeholder">
                    <div id="stream-status">Canlı Yayın Bekleniyor...</div>
                    <div id="viewer-count">0 İzleyici</div>
                </div>
            </div>
            <div class="stream-details">
                <h1 id="stream-title">Canlı Yayın Başlığı</h1>
                <p class="streamer-name" id="streamer-name">Yayıncı: Kullanıcı Adı</p>
                <button id="start-stream-btn" class="btn-live hidden">📡 Yayın Başlat</button>
                <button id="stop-stream-btn" class="btn-stop hidden">⏹️ Yayını Durdur</button>
            </div>
        </main>

        <section class="chat-sidebar">
            <div class="chat-header">💬 SOHBET</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Mesaj yaz...">
                <button id="send-msg-btn">Gönder</button>
            </div>
        </section>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
